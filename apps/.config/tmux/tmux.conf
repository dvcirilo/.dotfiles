# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ',st*:RGB,alacritty*:RGB'
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 50000
set -g mouse on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-keys vi
setw -g mode-keys vi

# edit / reload configuration
bind e new-window -n tmux.conf "sh -c '\${EDITOR:-vim} ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"tmux.conf sourced\"'"
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf sourced'


# -- display -------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename off
setw -g allow-rename off

set -g set-titles on
set -g set-titles-string '#{user}@#{host} [#I #W]'

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 5

setw -g monitor-activity on
set -g visual-activity off

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.1' \; clear-history


# -- navigation ----------------------------------------------------------------

bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# splits and new windows keep the current path
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

bind + resize-pane -Z

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

bind m set -g mouse \; display 'mouse #{?mouse,on,off}'


# -- copy mode & buffers -------------------------------------------------------

bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -i -selection clipboard >/dev/null 2>&1'
bind -T copy-mode-vi Escape send -X cancel
# mouse drag copies to clipboard and keeps the selection (q to leave copy mode)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear 'xclip -i -selection clipboard >/dev/null 2>&1'
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind y run -b 'tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1'
bind b list-buffers
bind p paste-buffer
bind P choose-buffer


# -- theme ---------------------------------------------------------------------

set -g status-position bottom
set -g status-style 'fg=#8a8a8a,bg=#1f1f1f'
set -g message-style 'fg=#262626,bg=#ffaf00,bold'
set -g message-command-style 'fg=#ffffff,bg=#000000'
setw -g mode-style 'fg=#000000,bg=#ffff00,bold'

setw -g pane-border-style 'fg=#444444'
setw -g pane-active-border-style 'fg=#87dfff'
set -g display-panes-colour '#00afff'
set -g display-panes-active-colour '#00afff'

setw -g clock-mode-colour cyan
setw -g clock-mode-style 24

set -g status-left-length 100
set -g status-left '#[fg=#005f00,bg=#afdf00,bold] ❐ #S #[fg=#afdf00,bg=default,none] '

set -g status-right-length 200
set -g status-right '#[fg=#505050]#[fg=#c0c0c0,bg=#505050]#{?client_prefix,⌨  ,}#{?session_many_attached,👁 ,}#{?pane_synchronized,🔒,} #(dropboxchk) #[fg=#808080,bg=#505050]#[fg=#e0e0e0,bg=#808080] %d/%m %R #[fg=#e0e0e0,bg=#808080]#[fg=#404040,bg=#e0e0e0] #H '

setw -g window-status-separator ' '
setw -g window-status-format '#I  #W#{?window_bell_flag,[!],}#{?window_zoomed_flag,[z],}'
setw -g window-status-current-format '#[fg=#1f1f1f,bg=colour117]#[fg=#000000,bold] #I  #W#{?window_zoomed_flag,[z],} #[fg=colour117,bg=#1f1f1f,none]'
setw -g window-status-current-style 'fg=#000000,bg=colour117,bold'
setw -g window-status-last-style 'fg=#cccccc'
setw -g window-status-bell-style 'fg=#ffff00,blink,bold'
